<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="HARBOR">
  <title>HARBOR — anchor whose crossbar is an agent pipeline</title>
  <!-- An anchor, but the stock is a three-node dispatch graph: the nautical name and the
       harness idea in one mark. -->
  <g fill="none" stroke="#0FB6C9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="32" cy="13.5" r="5.5"/>
    <path d="M32 19 V52"/>
    <path d="M17 27 H47"/>
    <path d="M15 37 C15 49 23 55.5 32 55.5 C41 55.5 49 49 49 37"/>
  </g>
  <g fill="#0FB6C9">
    <circle cx="17" cy="27" r="4"/>
    <circle cx="32" cy="27" r="4"/>
    <circle cx="47" cy="27" r="4"/>
  </g>
</svg>
