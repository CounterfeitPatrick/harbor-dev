[project]
name = "robot-bench-registry"
version = "0.1.0"
description = "MCP server: single source of truth for verified benchmark + policy registries."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
robot-bench-registry = "server:mcp.run"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
