name: docs

# Builds the VitePress site and publishes it to GitHub Pages.
#
# The reference pages under docs/reference/ are generated from commands/*.md and
# agents/*.md rather than written by hand, so the build regenerates them first and the
# `check` job fails the PR if what is committed has drifted from the plugin source.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Never cancel an in-flight deploy: a half-published Pages deployment is worse than a
  # slightly stale one, and the cancelled run reports as a failed build. This matches
  # GitHub's own Pages workflow template.
  cancel-in-progress: false

jobs:
  check-reference:
    name: reference docs are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 tools/gen_docs_reference.py --check

  build:
    name: build
    runs-on: ubuntu-latest
    needs: check-reference
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # lastUpdated timestamps come from git history
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm install
      # The landing page shows the full gallery. The tiles live once, in assets/;
      # copying them at build time keeps ~4.8 MB from being committed twice.
      - run: mkdir -p docs/public/gallery && cp assets/gallery/*.webp docs/public/gallery/
      - run: npm run docs:build
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: docs/.vitepress/dist

  deploy:
    name: deploy
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
